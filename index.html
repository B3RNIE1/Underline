<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMASK - Daily Word Game</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-bg: #1a1a1c;
            --tile-border: #3a3a3c;
            --correct-bg: #538d4e;
            --absent-bg: #3a3a3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            border-bottom: 1px solid var(--tile-border);
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 10px 0;
            letter-spacing: 3px;
            font-size: 2.2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* Upgraded Target Word Layout (Wordle-style Blank Blocks) */
        #targetDisplay {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            width: 100%;
        }

        .target-letter {
            width: 40px;
            height: 40px;
            border: 2px solid var(--tile-border);
            background-color: var(--tile-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .target-letter.revealed {
            background-color: var(--correct-bg);
            border-color: var(--correct-bg);
            color: white;
            animation: flipIn 0.5s ease forwards;
        }

        /* Player 5-Letter Guess Board Grid */
        #board {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 250px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .cell {
            aspect-ratio: 1;
            border: 2px solid var(--tile-border);
            background-color: var(--tile-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .cell.active {
            border-color: #565758;
        }

        .cell.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-bg);
        }

        .cell.absent {
            background-color: var(--absent-bg);
            border-color: var(--absent-bg);
        }

        /* Interactive UI controls */
        .controls {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 250px;
            gap: 10px;
        }

        input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid var(--tile-border);
            background-color: var(--tile-bg);
            color: var(--text-color);
            border-radius: 4px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input:focus {
            outline: none;
            border-color: #818384;
        }

        button {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #565758;
        }

        #shareBtn {
            background-color: var(--correct-bg);
            display: none;
        }

        #shareBtn:hover {
            background-color: #43713f;
        }

        #message {
            font-weight: bold;
            text-align: center;
            min-height: 24px;
            color: #ff5555;
        }

        @keyframes flipIn {
            0% { transform: rotateX(90deg); opacity: 0; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>UNMASK</h1>
    </header>

    <div class="container">
        <!-- Hidden 10-12 Letter Secret Word Matrix -->
        <div id="targetDisplay"></div>

        <!-- 5x5 Player Guess Matrix -->
        <div id="board"></div>

        <div class="controls">
            <input type="text" id="guessInput" maxlength="5" placeholder="TYPE 5 LETTERS" autocomplete="off">
            <button id="submitBtn">Submit Guess</button>
            <button id="shareBtn">Share Results</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // Set up the Secret Word (12 Letters long)
        const targetWord = "KALEIDOSCOPE"; 
        const maxTries = 5;
        let currentTry = 0;
        let gameOver = false;
        let historyGrids = [];
        let revealedLetters = new Set();

        // Target UI Blocks
        const targetDisplay = document.getElementById('targetDisplay');
        const board = document.getElementById('board');
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const shareBtn = document.getElementById('shareBtn');
        const messageDisplay = document.getElementById('message');

        // Function that builds the clean UI layouts safely
        function startUpGame() {
            targetDisplay.innerHTML = "";
            board.innerHTML = "";

            // 1. Build Wordle-style blocks for the big hidden word
            for (let i = 0; i < targetWord.length; i++) {
                const box = document.createElement('div');
                box.classList.add('target-letter');
                box.setAttribute('id', `target-${i}`);
                box.innerText = ""; // Starts empty just like Wordle
                targetDisplay.appendChild(box);
            }

            // 2. Build the standard 5x5 Grid Board below it
            for (let r = 0; r < maxTries; r++) {
                const row = document.createElement('div');
                row.classList.add('row');
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.setAttribute('id', `cell-${r}-${c}`);
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
            guessInput.focus();
        }

        // Mirrors user typing directly into the rows
        guessInput.addEventListener('input', (e) => {
            if (gameOver) return;
            const val = e.target.value.toUpperCase();
            for (let c = 0; c < 5; c++) {
                const cell = document.getElementById(`cell-${currentTry}-${c}`);
                if (cell) {
                    if (val[c]) {
                        cell.innerText = val[c];
                        cell.classList.add('active');
                    } else {
                        cell.innerText = "";
                        cell.classList.remove('active');
                    }
                }
            }
        });

        // Submit guess evaluation calculations
        function processGuess() {
            if (gameOver) return;

            const guess = guessInput.value.toUpperCase();

            if (guess.length !== 5) {
                printMessage("Guess must be exactly 5 letters!");
                return;
            }

            printMessage(""); // Flush errors
            let rowEmojiPattern = "";

            // Grade the current row matching letters
            for (let c = 0; c < 5; c++) {
                const letter = guess[c];
                const cell = document.getElementById(`cell-${currentTry}-${c}`);

                if (targetWord.includes(letter)) {
                    cell.classList.add('correct');
                    rowEmojiPattern += "🟩";
                    revealedLetters.add(letter);
                } else {
                    cell.classList.add('absent');
                    rowEmojiPattern += "⬛";
                }
            }

            historyGrids.push(rowEmojiPattern);

            // Re-render and unmask correct letter tiles at the top
            let wonGame = true;
            for (let i = 0; i < targetWord.length; i++) {
                const currentLetter = targetWord[i];
                const box = document.getElementById(`target-${i}`);
                if (revealedLetters.has(currentLetter)) {
                    box.innerText = currentLetter;
                    box.classList.add('revealed');
                } else {
                    wonGame = false;
                }
            }

            currentTry++;
            guessInput.value = "";

            // Check End Conditions
            if (wonGame) {
                printMessage("🎉 You Unmasked the word completely!");
                finishGame();
            } else if (currentTry >= maxTries) {
                printMessage(`Game Over! The mystery word was ${targetWord}`);
                finishGame();
