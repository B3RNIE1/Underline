<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMASK - Daily Word Game</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-bg: #1a1a1c;
            --tile-border: #3a3a3c;
            --correct-bg: #538d4e;
            --absent-bg: #3a3a3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            border-bottom: 1px solid var(--tile-border);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
            letter-spacing: 2px;
            font-size: 2rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Target Word Styling */
        #targetDisplay {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .target-letter {
            width: 35px;
            height: 45px;
            border-bottom: 4px solid #818384;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .target-letter.revealed {
            border-bottom: 4px solid var(--correct-bg);
            color: var(--correct-bg);
            animation: pop 0.3s ease;
        }

        /* Guess Board Grid */
        #board {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 300px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .cell {
            aspect-ratio: 1;
            border: 2px solid var(--tile-border);
            background-color: var(--tile-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .cell.active {
            border-color: #565758;
        }

        .cell.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-bg);
        }

        .cell.absent {
            background-color: var(--absent-bg);
            border-color: var(--absent-bg);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            gap: 10px;
        }

        input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid var(--tile-border);
            background-color: var(--tile-bg);
            color: var(--text-color);
            border-radius: 4px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input:focus {
            outline: none;
            border-color: #818384;
        }

        button {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #565758;
        }

        #shareBtn {
            background-color: var(--correct-bg);
            display: none;
        }

        #shareBtn:hover {
            background-color: #43713f;
        }

        #message {
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>UNMASK</h1>
    </header>

    <div class="container">
        <!-- The big word to reveal -->
        <div id="targetDisplay"></div>

        <!-- The 5x5 guess grid -->
        <div id="board"></div>

        <div class="controls">
            <input type="text" id="guessInput" maxlength="5" placeholder="TYPE 5 LETTERS" autocomplete="off">
            <button id="submitBtn">Submit Guess</button>
            <button id="shareBtn">Share Results</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // Game Configuration
        const targetWord = "KALEIDOSCOPE"; // 12-letter secret word
        const maxTries = 5;
        let currentTry = 0;
        let gameOver = false;
        let historyGrids = [];
        let revealedLetters = new Set();

        // Elements
        const targetDisplay = document.getElementById('targetDisplay');
        const board = document.getElementById('board');
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const shareBtn = document.getElementById('shareBtn');
        const messageDisplay = document.getElementById('message');

        // Initialize Game
        function initGame() {
            // Build MegaWord blanks
            for (let i = 0; i < targetWord.length; i++) {
                const span = document.createElement('span');
                span.classList.add('target-letter');
                span.setAttribute('id', `target-${i}`);
                span.innerText = "_";
                targetDisplay.appendChild(span);
            }

            // Build 5x5 Grid Board
            for (let r = 0; r < maxTries; r++) {
                const row = document.createElement('div');
                row.classList.add('row');
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.setAttribute('id', `cell-${r}-${c}`);
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
            guessInput.focus();
        }

        // Live grid rendering as the user types
        guessInput.addEventListener('input', (e) => {
            if (gameOver) return;
            const val = e.target.value.toUpperCase();
            for (let c = 0; c < 5; c++) {
                const cell = document.getElementById(`cell-${currentTry}-${c}`);
                if (val[c]) {
                    cell.innerText = val[c];
                    cell.classList.add('active');
                } else {
                    cell.innerText = "";
                    cell.classList.remove('active');
                }
            }
        });

        // Submit Logic
        function submitGuess() {
            if (gameOver) return;

            const guess = guessInput.value.toUpperCase();

            if (guess.length !== 5) {
                showMessage("Guess must be exactly 5 letters!");
                return;
            }

            showMessage(""); // Clear errors
            let rowEmojiPattern = "";

            // Evaluate the 5-letter guess against the large target word
            for (let c = 0; c < 5; c++) {
                const letter = guess[c];
                const cell = document.getElementById(`cell-${currentTry}-${c}`);

                if (targetWord.includes(letter)) {
                    cell.classList.add('correct');
                    rowEmojiPattern += "🟩";
                    revealedLetters.add(letter);
                } else {
                    cell.classList.add('absent');
                    rowEmojiPattern += "⬛";
                }
            }

            historyGrids.push(rowEmojiPattern);

            // Update the Top Target MegaWord Blocks
            let completelyUnmasked = true;
            for (let i = 0; i < targetWord.length; i++) {
                const letter = targetWord[i];
                const span = document.getElementById(`target-${i}`);
                if (revealedLetters.has(letter)) {
                    span.innerText = letter;
                    span.classList.add('revealed');
                } else {
                    completelyUnmasked = false;
                }
            }

            // Move to next line
            currentTry++;
            guessInput.value = "";

            // Check Win / Loss Conditions
            if (completelyUnmasked) {
                showMessage("🎉 Spectacular! You completely unmasked the word!");
                endGame();
            } else if (currentTry >= maxTries) {
                showMessage(`Game Over! The word was ${targetWord}`);
                endGame();
            }
        }

        function showMessage(msg) {
            messageDisplay.innerText = msg;
        }

        function endGame() {
            gameOver = true;
            guessInput.disabled = true;
            submitBtn.style.display = "none";
            shareBtn.style.display = "block";
        }

        // Action Listeners
        submitBtn.addEventListener('click', submitGuess);
        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitGuess();
        });
